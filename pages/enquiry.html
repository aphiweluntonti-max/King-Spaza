            <br/><br/>
                <label for="message" name="message">Message:</label><br/>
                <textarea name="message" rows="10" cols="40" placeholder="Tell us more about your project" required></textarea>

                    Submit 
                </button>
                <button type="cancel">
                    Cancel
                </button>
